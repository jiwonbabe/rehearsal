<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div id="taught" style="display:none;background:#17181c;color:#f3f4f1;border-radius:12px;padding:16px 20px;gap:16px;align-items:center;grid-template-columns:auto 1fr">
    <div style="font-size:11px;font-weight:600;color:#9fb8cf;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">What October taught us</div>
    <div id="taught-body" style="font-size:14px;line-height:1.45"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px"><h1 id="title" style="margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em"></h1></div>
  <div id="season" class="card" style="display:none;padding:18px 22px;gap:8px"></div>
  <div id="channels" class="card" style="display:none;padding:22px;gap:14px"></div>
  <div id="cards" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px"></div>
  <div class="card" style="padding:20px 24px;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <div id="foot" style="font-size:13px;color:#5c6066"></div>
    <button id="go" class="btn" disabled>Test these</button>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
renderHeader(1, 'Directions · this month');
let dirs = [], sel = getSelected().slice(0, 2);
const line = (label, text) => { const r = document.createElement('div'); r.innerHTML = '<span style="font-weight:600"></span> <span></span>'; r.firstChild.textContent = label; r.lastChild.textContent = text; return r; };
function renderPlaybook(box, pb) {
  if (!pb || !pb.weeks || !pb.weeks[0].do) return;
  box.style.display = 'flex';
  box.appendChild(line('Week 1:', pb.weeks[0].do));
  if (pb.ad && pb.ad.audience) box.appendChild(line('Ads:', pb.ad.audience));
  if (pb.creator_brief && pb.creator_brief.who) box.appendChild(line('Creators:', pb.creator_brief.who));
  const det = document.createElement('details');
  det.innerHTML = '<summary style="cursor:pointer;font-size:12px;color:#5c6066">Full playbook · Muse Spark</summary>';
  pb.weeks.forEach(w => {
    const r = line(`Week ${w.week}:`, w.do);
    r.style.cssText = 'margin-top:6px';
    if (w.post_idea) { const i = document.createElement('div'); i.style.cssText = 'color:#5c6066;font-size:12.5px'; i.textContent = 'Post idea: ' + w.post_idea; r.appendChild(i); }
    det.appendChild(r);
  });
  box.appendChild(det);
}
function draw() {
  $cards.innerHTML = '';
  dirs.forEach(d => {
    const on = sel.includes(d.id), r = d.ranges;
    const b = document.createElement('button');
    b.className = on ? 'btn' : 'btn ghost';
    b.style.minHeight = '36px'; b.style.fontSize = '13px'; b.style.padding = '0 16px';
    b.textContent = on ? 'Selected' : 'Select';
    b.onclick = () => {
      if (on) sel = sel.filter(x => x !== d.id);
      else if (sel.length < 2) sel.push(d.id);
      else { $foot.textContent = 'Up to two directions at a time. Unselect one first.'; $foot.style.color = '#c2410c'; return; }
      draw();
    };
    const c = document.createElement('div');
    c.className = 'card' + (on ? ' on' : '');
    c.style.padding = '22px';
    const rangeLine = `${money(r.ads_usd[0])}–${money(r.ads_usd[1])} ads · ${r.creator_count[0]}–${r.creator_count[1]} creators · ${r.posts_per_week[0]}–${r.posts_per_week[1]} posts/wk`;
    c.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div style="font-size:12px;font-weight:600;color:${d.rank === 1 ? '#2f5d8a' : '#5c6066'};text-transform:uppercase;letter-spacing:.06em">${d.rank === 1 ? 'Suggested first' : 'Also fits'}</div>
        <span class="pick"></span></div>
      <div style="font-size:20px;font-weight:600"></div>
      <div class="mono" style="font-size:12px;color:#5c6066">${rangeLine}</div>
      <div class="plain" style="font-size:14px;color:#5c6066;line-height:1.5"></div>
      <div style="display:flex;gap:10px;padding:10px 12px;background:#f3f4f1;border-radius:8px;font-size:13px;line-height:1.45"><span style="font-weight:600;white-space:nowrap">Why for you</span><span class="why"></span></div>
      <div class="do" style="font-size:12px;color:#5c6066"></div>
      <div class="pb" style="display:none;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;border-top:1px solid #e6e7e2;padding-top:10px"></div>`;
    c.children[1].textContent = d.title;
    c.querySelector('.pick').appendChild(b);
    c.querySelector('.plain').textContent = d.plain;
    c.querySelector('.why').textContent = d.why_for_you;
    c.querySelector('.do').textContent = 'You would do: ' + d.you_would_do;
    renderPlaybook(c.querySelector('.pb'), d.playbook);
    if (d.caution) {
      const k = document.createElement('div');
      k.className = 'caution';
      k.innerHTML = '<span style="font-weight:600;white-space:nowrap;color:#c2410c">Caution</span><span></span>';
      k.lastChild.textContent = d.caution;
      c.insertBefore(k, c.querySelector('.do'));
    }
    $cards.appendChild(c);
  });
  const n = sel.length;
  setSelected(sel);
  $foot.style.color = '';
  $foot.textContent = n === 0 ? 'Pick one or two directions to test.' : `${n} direction${n === 1 ? '' : 's'} selected · the engine will build ${n * 60} variants and attack each with 20 bad months.`;
  $go.disabled = n === 0;
  $go.style.opacity = n === 0 ? '.4' : '1';
}
const CH = { instagram_reels: 'Instagram Reels', instagram_feed: 'Instagram feed', instagram_stories: 'Instagram Stories', threads: 'Threads', facebook: 'Facebook', naver_blog: 'Naver blog', tiktok: 'TikTok', x: 'X' };
const VERDICT = { lead: ['Lead', '#2f6f3e', '#e8f3ea'], support: ['Support', '#8a6d1f', '#fbf3dc'], skip: ['Skip', '#5c6066', '#f3f4f1'] };
function badge(text, bg, fg) { const b = document.createElement('span'); b.textContent = text; b.style.cssText = `display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${bg};color:${fg};white-space:nowrap`; return b; }
function tagged(label, bg, fg, text) {
  const r = document.createElement('div'); r.style.cssText = 'display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5';
  r.appendChild(badge(label, bg, fg)); const t = document.createElement('span'); t.textContent = text; r.appendChild(t); return r;
}
function statFor(line, stats) {
  return (stats || []).find(r => line.includes(`${Math.round(r.share * 100)}%`));
}
function renderSeason(se) {
  if (!se || !se.applied || !se.month) return;
  const box = document.getElementById('season');
  box.innerHTML = '';
  const head = document.createElement('div'); head.style.cssText = 'display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline';
  const h = document.createElement('div'); h.style.cssText = 'font-size:16px;font-weight:600'; h.textContent = `This month: ${se.name}`;
  const idx = document.createElement('div'); idx.className = 'mono'; idx.style.cssText = 'font-size:13px;color:#5c6066';
  idx.textContent = `demand ${se.demand}× · ad cost ${se.ad_cost}× · 1.00 = an average month`;
  head.appendChild(h); head.appendChild(idx); box.appendChild(head);
  if (se.note) box.appendChild(tagged('Spark', '#f3f4f1', '#5c6066', se.note));
  const line = document.createElement('div'); line.style.cssText = 'font-size:12.5px;color:#5c6066;line-height:1.5';
  line.textContent = `Seasonal prior from public data (${se.market} ${se.category}), applied to the order rate and ad reach for this month only; the adversary tests the month turning out average. Not learned from your history: one year cannot separate seasons from everything else.`;
  box.appendChild(line);
  (se.sources || []).forEach(src => { const a = document.createElement('a'); a.href = src.url; a.target = '_blank'; a.style.cssText = 'font-size:11.5px;color:#5c6066'; a.textContent = `Source (${src.for}): ${src.source}, ${src.year}`; box.appendChild(a); });
  box.style.display = 'flex';
}
function renderChannels(list, connected, handle, ev) {
  const box = document.getElementById('channels');
  box.innerHTML = '';
  const head = document.createElement('div'); head.style.cssText = 'display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline';
  const h = document.createElement('div'); h.style.cssText = 'font-size:18px;font-weight:600'; h.textContent = 'Where to post, and why'; head.appendChild(h);
  const sub = document.createElement('div'); sub.style.cssText = 'font-size:12px;color:#5c6066';
  const demo = ev && ev.evidence && ev.evidence.source === 'mock';
  sub.textContent = connected ? (demo ? `Reasoned from the demo account @${handle}'s mock Instagram and Threads data (${ev.evidence.days} days; not your real numbers) and sourced public statistics · not stress-tested` : `Reasoned from @${handle}'s Instagram and Threads data (${ev.evidence.days} days) and sourced public statistics · not stress-tested`) : 'Connect your Instagram on Setup to see where to post for your brand.';
  head.appendChild(sub); box.appendChild(head); box.style.display = 'flex';
  if (!list || !list.length) return;
  const chips = document.createElement('div'); chips.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px';
  ['lead', 'support', 'skip'].forEach(v => { const names = list.filter(c => c.verdict === v).map(c => CH[c.channel] || c.channel); if (!names.length) return; const [label, fg, bg] = VERDICT[v]; chips.appendChild(badge(label, bg, fg)); const t = document.createElement('span'); t.textContent = names.join(', '); t.style.marginRight = '10px'; chips.appendChild(t); });
  box.appendChild(chips);
  const det = document.createElement('details'); det.innerHTML = '<summary style="cursor:pointer;font-size:12.5px;color:#5c6066">Show why, channel by channel</summary>';
  const grid = document.createElement('div'); grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px';
  list.forEach(c => {
    const card = document.createElement('div'); card.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid #e6e7e2;border-radius:10px';
    const [v, fg, bg] = VERDICT[c.verdict] || VERDICT.skip;
    const top = document.createElement('div'); top.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px';
    const name = document.createElement('div'); name.style.cssText = 'font-size:15px;font-weight:600'; name.textContent = CH[c.channel] || c.channel;
    top.appendChild(name); top.appendChild(badge(v, bg, fg)); card.appendChild(top);
    if (c.why_data) {
      const st = statFor(c.why_data, ev && ev.stats);
      card.appendChild(tagged(st ? 'Public data' : (demo ? 'Your data · demo' : 'Your data'), '#e4edf6', '#2f5d8a', c.why_data));
      if (st) { const src = document.createElement('a'); src.href = st.url; src.target = '_blank'; src.style.cssText = 'font-size:11.5px;color:#5c6066'; src.textContent = `Source: ${st.source}, ${st.year}`; card.appendChild(src); }
    }
    if (c.why_category) card.appendChild(tagged('Spark reasoning', '#f3f4f1', '#5c6066', c.why_category));
    if (c.how) { const how = document.createElement('div'); how.style.cssText = 'font-size:13px;line-height:1.5;border-top:1px solid #e6e7e2;padding-top:8px'; how.textContent = c.how; card.appendChild(how); }
    grid.appendChild(card);
  });
  det.appendChild(grid); box.appendChild(det);
}
const $cards = document.getElementById('cards'), $foot = document.getElementById('foot'), $go = document.getElementById('go');
$go.onclick = () => { setSelected(sel); location.href = '/simulate.html'; };
(async () => {
  try {
    const data = await api('/api/directions');
    dirs = data.directions.slice().sort((a, b) => a.rank - b.rank);
    renderSeason(data.season);
    try { const ev = data.channels ? await api('/api/evidence') : null; renderChannels(data.channels, !!ev, ev && ev.handle, ev); } catch (e) { renderChannels(null, false); }
    sel = sel.filter(id => dirs.some(d => d.id === id));
    document.getElementById('title').textContent = (data.month === 2 ? 'November' : 'This month') + ': pick one or two directions';
    const lm = data.last_month;
    if (data.month === 2 && lm) {
      const t = document.getElementById('taught');
      t.style.display = 'grid';
      const body = document.getElementById('taught-body');
      const p = (s) => { const e = document.createElement('div'); e.textContent = s; body.appendChild(e); };
      p(lm.diagnosis);
      p(`Orders ${lm.actual.orders} vs ${lm.range[0]}–${lm.range[1]}`);
      (lm.rate_changes || []).forEach(r => p(`${r.rate} ${r.old} → ${r.new}`));
    }
    draw();
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
