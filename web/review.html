<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div id="main" style="display:none;flex-direction:column;gap:20px;max-width:820px">
    <h1 id="title" style="margin:0;font-size:28px;font-weight:600"></h1>
    <div id="ran" style="font-size:14px;color:#5c6066"></div>
    <div class="card"><div style="font-size:13px;font-weight:600">Expected range vs what happened</div><div id="rows" style="display:flex;flex-direction:column;gap:8px;font-size:14px"></div></div>
    <div class="card"><div style="font-size:13px;font-weight:600">Diagnosis</div><div id="diag" style="font-size:14px;line-height:1.5"></div></div>
    <div class="card"><div style="font-size:13px;font-weight:600">What the engine changed</div><div id="changes" style="display:flex;flex-direction:column;gap:6px;font-size:14px"></div></div>
    <div style="font-size:13px;color:#5c6066">Small steps. One month is evidence, not a verdict. Next month's directions are re-ranked with this.</div>
    <button id="apply" class="btn" style="align-self:flex-start">Plan November</button>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
renderHeader(4, 'Review · October, the month that just ended');
const el = (tag, css, text) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (text !== undefined) e.textContent = text; return e; };
(async () => {
  try {
    const d = await api('/api/review', {});
    const r = d.review, a = r.actual;
    document.getElementById('main').style.display = 'flex';
    const where = r.inside_range ? 'inside range' : (a.orders > r.range[1] ? 'above range' : 'below range');
    document.getElementById('title').textContent = `October: ${where}. ` + (where === 'above range' ? 'Here is what went better than the engine thought.' : where === 'inside range' ? 'Here is what the engine got right.' : 'Here is what was off.');
    document.getElementById('apply').textContent = `Preview ${d.next_month_name || 'next month'} with the re-learned rates`;
    document.getElementById('apply').insertAdjacentHTML('afterend', '<div style="font-size:12.5px;color:#5c6066;line-height:1.5;margin-top:6px">The data ends in October, so this month\'s plan is November and the review is of October. The preview plans the month after with the rates learned here; it is a look ahead, not a record of November.</div>')
    document.getElementById('ran').textContent = `You ran ${planText(d.committed)}.`;
    const out = a.orders < r.range[0] || a.orders > r.range[1];
    const rows = document.getElementById('rows');
    const row = (k, v, bad) => { const x = el('div', 'display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #d9dbd4;padding-bottom:6px'); x.appendChild(el('span', '', k)); x.appendChild(el('span', 'font-weight:500' + (bad ? ';color:#c2410c' : ''), v)); rows.appendChild(x); };
    row('Orders', `${a.orders} vs ${Math.round(r.range[0])}–${Math.round(r.range[1])}`, out);
    row('Creator posts', `${a.creators_posted} of ${a.creators_seeded}`);
    row('Spend', money(a.spend_usd));
    document.getElementById('diag').textContent = r.diagnosis;
    const ch = document.getElementById('changes');
    (r.rate_changes || []).forEach(c => ch.appendChild(el('div', 'font-family:IBM Plex Mono,monospace', `${c.rate} ${c.old} → ${c.new}`)));
    if (!ch.children.length) ch.textContent = 'No rate changed.';
    document.getElementById('apply').onclick = async () => {
      try {
        await api('/api/review/apply', {});
        sessionStorage.removeItem('rehearsal.selected');
        location.href = '/directions.html';
      } catch (e) { showError(e); }
    };
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
