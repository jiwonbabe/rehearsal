<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal verdict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div id="empty" style="display:none;font-size:15px">Pick a direction first. <a href="/directions.html">Back to directions</a></div>
  <div id="main" style="display:none;flex-direction:column;gap:20px">
    <h1 id="title" style="margin:0;font-size:28px;font-weight:600"></h1>
    <div id="sub" style="font-size:14px;color:#5c6066;max-width:760px;line-height:1.5">The best variant from each direction you picked, plus the no-spend baseline. Survived = hit your order goal in that many of 20 bad months without running out of budget early.</div>
    <div id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px"></div>
    <div id="todo" class="card" style="display:none"></div>
    <div id="flip" class="card"></div>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
renderHeader(4, 'Verdict');
const el = (tag, css, text) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (text !== undefined) e.textContent = text; return e; };
function renderTodo(p) {
  const mix = planText(p).replace(/^post [^(]*\(/, '').replace(/\).*$/, '');
  const w1 = [`Post ${p.posts_per_week}× (${mix})`];
  if (p.ads_usd > 0) w1.push(`Pick your 2 best on-hand posts and set a daily cap of ${money(p.ads_usd / 28)}`);
  if (p.creator_count > 0) w1.push(`DM and ship ${p.creator_count} pieces`);
  const rows = [['Week 1', w1]];
  if (p.promo_week === 1) w1.push(`Announce ${pct(p.promo_discount)} off`);
  for (let w = 2; w <= 4; w++) {
    const l = [`Post ${p.posts_per_week}×`];
    if (p.promo_week === w) l.push(`Announce ${pct(p.promo_discount)} off`);
    if (w === 4) l.push('Review opens next month');
    rows.push([`Week ${w}`, l]);
  }
  const box = document.getElementById('todo');
  box.innerHTML = '';
  box.style.display = 'flex';
  box.appendChild(el('div', 'font-size:13px;font-weight:600', p.plan_id === 'baseline' ? 'Baseline committed: keep posting, spend nothing' : 'Your month, generated on commit'));
  if (p.plan_id === 'baseline') box.appendChild(el('div', 'font-size:13px;color:#5c6066', 'This is the do-nothing-new choice. Launch will only give you the posting calendar.'));
  rows.forEach(([k, l]) => {
    const r = el('div', 'display:flex;gap:16px;font-size:13.5px;line-height:1.5');
    r.appendChild(el('div', 'width:70px;font-weight:600;flex:none', k));
    r.appendChild(el('div', '', l.join('. ')));
    box.appendChild(r);
  });
  const row = el('div', 'display:flex;gap:10px;flex-wrap:wrap');
  const go = el('a', '', 'Make it happen →'); go.className = 'btn'; go.href = '/launch.html';
  const a = el('a', '', 'Review October'); a.className = 'btn ghost'; a.href = '/review.html';
  row.appendChild(go); row.appendChild(a);
  box.appendChild(row);
}
(async () => {
  const ids = getSelected();
  if (!ids.length) { document.getElementById('empty').style.display = 'block'; return; }
  try {
    const data = await api('/api/stress', { direction_ids: ids });
    const titles = {};
    data.directions.forEach(d => { titles[d.id] = d.title; });
    const titleOf = p => p.plan_id === 'baseline' ? 'Just post · baseline' : (titles[p.direction] || p.direction);
    document.getElementById('main').style.display = 'flex';
    const first = data.verdict.find(v => v.plan.plan_id !== 'baseline');
    const gapOf = p => (data.gaps || []).find(g => g.plan_id === p.plan_id);
    const firstGap = first && gapOf(first.plan);
    const base = data.verdict.find(v => v.plan.plan_id === 'baseline');
    const easy = base && base.survived >= Math.ceil(base.total * 0.8);
    document.getElementById('title').textContent = !first ? 'Verdict: no paid direction holds this month.'
      : easy ? `Verdict: just posting already clears a ${data.goal}-order goal in ${base.survived} of ${base.total} bad months.`
      : (firstGap && firstGap.extra_orders <= 2) ? `Verdict: ${titleOf(first.plan)} barely beats just posting this month.`
      : `Verdict: ${titleOf(first.plan)} holds this month.`;
    if (easy) {
      const bar = el('div', 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;line-height:1.5;padding:12px 14px;background:#fff4ec;border:1px solid #f0c9ad;border-radius:8px');
      bar.appendChild(el('span', '', data.season_goal && data.season_goal !== data.goal
        ? `${data.month_name} usually brings ${data.demand}× an average month, so ${data.goal} is a low bar. Either keep the money, or raise the bar to a ${data.month_name}-sized goal of ${data.season_goal} and test again.`
        : 'This goal is a low bar for this month. Either keep the money, or raise the goal on Setup and test again.'));
      if (data.season_goal && data.season_goal !== data.goal) {
        const b = el('button', 'min-height:34px;font-size:13px;padding:0 14px', `Use ${data.season_goal} and re-test`); b.className = 'btn ghost';
        b.onclick = async () => { b.disabled = true; try { await api('/api/setup', { goal_orders_per_month: data.season_goal, goal_month: data.month }); location.reload(); } catch (e) { b.disabled = false; showError(e); } };
        bar.appendChild(b);
      }
      document.getElementById('main').insertBefore(bar, document.getElementById('cards'));
    }
    document.getElementById('sub').textContent += ' ' + stateLine(data.goal, data.budget, data.month_name);
    data.verdict.forEach(v => {
      const c = el('div'); c.className = 'card';
      const un = (data.untested || {})[v.plan.plan_id] || [];
      const uses = { ads: v.plan.ads_usd > 0, creators: v.plan.creator_count > 0, sale: v.plan.promo_week != null };
      c.appendChild(el('div', 'font-size:15px;font-weight:600', un.length ? `${titleOf(v.plan)} · not rated` : `${titleOf(v.plan)} · survived ${v.survived} / ${v.total}`));
      if (un.length) {
        c.appendChild(el('div', 'font-size:12.5px;color:#5c6066;line-height:1.45', planText(v.plan)));
        c.appendChild(el('div', 'font-size:13px;color:#c2410c;line-height:1.5', `Not rated: your history has no weeks with ${un.map(l => LEVER[l]).join(' or ')}, so the engine cannot say what ${un.map(l => LEVER[l]).join(' or ')} would do for you. Run a small test first; do not trust a number here.`));
        document.getElementById('cards').appendChild(c);
        return;
      }
      const cm = (data.creator_math || {})[v.plan.plan_id];
      if (cm) c.appendChild(el('div', 'font-size:12.5px;color:#2f5d8a;line-height:1.5', creatorMathText(cm)));
      if (cm && (data.creator_bands || []).length) c.appendChild(creatorFinder([], data.creator_bands));
      if (v.plan.creator_count > 0 && (data.creator_pool || []).length) {
        const pool = data.creator_pool;
        c.appendChild(el('div', 'font-size:12.5px;color:#5c6066;line-height:1.45', `Creators counted (followers × engagement rate): ${pool.map(p => `@${p.username} ${p.expected_engagement}`).join(', ')}. Each bad month lands a different ${Math.round(v.plan.creator_count)} of them.`));
      }
      thinLevers(uses, data.coverage).forEach(l => c.appendChild(el('div', 'font-size:12.5px;color:#8a6d1f;line-height:1.45', `Thin evidence: your history used ${LEVER[l]} in only ${(data.coverage.find(x => x.lever === l) || {}).weeks} weeks, so the ${LEVER[l]} rate rests on a handful of observations.`)));
      c.appendChild(el('div', 'font-size:12.5px;color:#5c6066;line-height:1.45', planText(v.plan)));
      c.appendChild(el('div', 'font-size:13.5px', `Orders, bad month ${Math.round(v.orders_bad_month[0])}–${Math.round(v.orders_bad_month[1])}`));
      c.appendChild(el('div', 'font-size:13.5px', `Spend ${money(v.spend_usd)}`));
      const bd = (data.breakdown || {})[v.plan.plan_id];
      if (bd) c.appendChild(el('div', `font-size:12.5px;line-height:1.45;color:${bd.left_usd < 0 ? '#c2410c' : '#5c6066'}`, breakdownText(bd)));
      const g = gapOf(v.plan);
      if (g) {
        const tone = g.extra_orders <= 2 ? '#c2410c' : (g.usd_per_extra_order > data.avg_price_usd ? '#8a6d1f' : '#2f6f3e');
        c.appendChild(el('div', `font-size:13px;color:${tone}`, g.extra_orders > 0
          ? `vs just posting: +${g.extra_orders} orders in a bad month for ${money(g.extra_spend_usd)} more · ${money(g.usd_per_extra_order)} per extra order (cost per purchase) · ${g.roas_extra}× return on the extra spend` + (g.usd_per_extra_order > data.avg_price_usd ? ' (more than a piece sells for)' : '')
          : `vs just posting: no extra orders in a bad month for ${money(g.extra_spend_usd)} more`));
      }
      c.appendChild(el('div', 'font-size:13.5px;color:#c2410c', `Dies if ${shockText(v.dies_if, data.catalog)}`));
      const b = el('button', 'align-self:flex-start', 'Commit to this plan'); b.className = 'btn';
      b.onclick = () => { setCommitted(v.plan, titleOf(v.plan), data.month, data.month_name); renderTodo(v.plan); document.getElementById('todo').scrollIntoView({ behavior: 'smooth' }); };
      c.appendChild(b);
      document.getElementById('cards').appendChild(c);
    });
    const f = data.flip, fb = document.getElementById('flip');
    fb.appendChild(el('div', 'font-size:13px;font-weight:600', 'The assumption that flips the answer'));
    if (!f) {
      fb.appendChild(el('div', 'font-size:14px', data.directions.length < 2 ? 'Pick two directions on the Directions page to see which assumption flips the answer.' : 'No creator post rate between 30% and 100% changes this ranking.'));
    } else {
      const dir = f.threshold > f.current ? 'or better' : 'or worse';
      const A = titles[data.flip_a], B = titles[data.flip_b];
      fb.appendChild(el('div', 'font-size:14px;line-height:1.5', f.a_wins_now
        ? `If creators post at ${pct(f.threshold)} ${dir}, ${B} beats ${A}. At your current ${pct(f.current)}, ${A} wins.`
        : `If creators post at ${pct(f.threshold)} ${dir}, ${A} beats ${B}. At your current ${pct(f.current)}, ${B} wins.`));
      if (data.check) {
        const ck = el('div', 'padding:12px 14px;background:#f3f4f1;border-radius:8px');
        ck.appendChild(el('div', 'font-size:12px;font-weight:600;color:#5c6066;margin-bottom:4px', 'What to check this week · Muse Spark'));
        ck.appendChild(el('div', 'font-size:13.5px;line-height:1.5', data.check));
        fb.appendChild(ck);
      }
    }
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
